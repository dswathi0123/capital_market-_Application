<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ETMS — Equity Trade Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">ETMS<span>.</span></div>
      <nav>
        <div class="nav-item active" data-view="blotter">Order blotter</div>
        <div class="nav-item" data-view="settlement">Clearing &amp; settlement</div>
        <div class="nav-item" data-view="reports">Reports</div>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Equity trade management</h1>
      </header>

      <section class="content">
        <!-- Order entry + blotter view -->
        <div id="view-blotter" class="view">
          <form id="order-form" class="panel">
            <h2>New order</h2>
            <div class="form-row">
              <div class="field">
                <label>Client account</label>
                <input name="clientAccount" placeholder="ACC-10245" required />
              </div>
              <div class="field">
                <label>Symbol</label>
                <input name="symbol" placeholder="RELIANCE" required />
              </div>
              <div class="field">
                <label>Quantity</label>
                <input name="quantity" type="number" min="1" required />
              </div>
              <div class="field">
                <label>Price</label>
                <input name="price" type="number" step="0.01" min="0" required />
              </div>
            </div>
            <div class="btn-row">
              <button type="submit" class="btn btn-buy" data-side="BUY">Buy</button>
              <button type="submit" class="btn btn-sell" data-side="SELL">Sell</button>
            </div>
            <p id="form-error" class="form-error"></p>
          </form>

          <div class="table-wrap">
            <div class="table-header">
              <h2>Today's blotter</h2>
              <span id="order-count" class="muted"></span>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Order ID</th><th>Client</th><th>Symbol</th><th>Side</th>
                  <th>Qty</th><th>Price</th><th>Status</th>
                </tr>
              </thead>
              <tbody id="orders-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Settlement view -->
        <div id="view-settlement" class="view" hidden>
          <div class="table-wrap">
            <div class="table-header"><h2>Settlement queue</h2></div>
            <table>
              <thead>
                <tr>
                  <th>Trade ID</th><th>Counterparty</th><th>Symbol</th>
                  <th>Net value</th><th>Settlement date</th><th>Progress</th><th>Status</th>
                </tr>
              </thead>
              <tbody id="settlement-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Reports view -->
        <div id="view-reports" class="view" hidden>
          <div class="stat-row" id="stat-row"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
